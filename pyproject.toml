[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-pipeline-migration"
version = "0.1.0"
description = "Migrate Control-M folder/job definitions: replace job commands from a CSV mapping and strip legacy job-name prefixes."
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
]

[project.scripts]
git-pipeline-migration = "git_pipeline_migration:main"
update-job-inventory = "update_job_inventory:main"

[tool.hatch.build.targets.wheel]
packages = ["src/git_pipeline_migration", "src/update_job_inventory"]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
